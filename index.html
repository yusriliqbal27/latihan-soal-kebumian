<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Kebumian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 4rem; }
        .question-img { max-width: 100%; height: auto; margin: 1rem 0; }
        .feedback { margin-top: 1rem; padding: 1rem; border-radius: 0.5rem; }
        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .wrong-mark { color: #dc3545; font-weight: bold; } /* red */
        .score-top { font-size: 1.3rem; font-weight: bold; margin-bottom: 0.5rem; }
        .question-block { border: 1px solid #ddd; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; background-color: #fafafa; }
        .btn-download { margin-top: 1rem; }
        .header-section { background: #f8f9fa; padding: 1.5rem; border-radius: 0.5rem; margin-bottom: 2rem; }
        .form-label { font-weight: 600; }
        .timer { font-size: 1.2rem; font-weight: 600; color: #2c3e50; }
        .nav-select { width: 100%; max-width: 200px; display: inline-block; }
        .hint { font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header for student info and timer -->
        <div id="header-section" class="header-section d-none">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <div class="mb-2">
                        <label for="student-name" class="form-label">Nama Lengkap</label>
                        <input type="text" class="form-control" id="student-name" placeholder="Nama Anda" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-2">
                        <label for="student-class" class="form-label">Kelas</label>
                        <input type="text" class="form-control" id="student-class" placeholder="Misal: X IPA 1" required>
                    </div>
                </div>
                <div class="col-md-4 text-md-end">
                    <div class="mb-2">
                        <label for="start-quiz" class="form-label d-block"></label>
                        <button id="start-quiz-btn" class="btn btn-primary btn-lg px-4">Mulai Latihan</button>
                    </div>
                    <div class="timer" id="timer-display">00:00:00</div>
                </div>
            </div>
        </div>

        <!-- Quiz container -->
        <div id="quiz-container">
            <!-- Soal akan diinject lewat JavaScript -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Memuat...</span>
                </div>
                <p class="mt-3">Memuat soal...</p>
            </div>
        </div>

        <!-- Score/review container -->
        <div id="score-container" class="mt-4 d-none">
            <div class="score-top" id="score-summary"></div>
            <div id="review-details"></div>
            <div class="mt-3 d-flex justify-content-between align-items-center">
                <button id="retake-btn" class="btn btn-outline-primary me-2">Ulangi Latihan</button>
                <button id="download-btn" class="btn btn-success btn-download">Unduh Hasil</button>
            </div>
        </div>
    </div>

    <script>
        let questions = [];
        let currentQuestionIndex = 0;
        let userAnswers = []; // array of selected answers per question index
        let totalQuestions = 0;
        let studentName = '';
        let studentClass = '';
        let startTime = null; // timestamp when quiz started
        let endTime = null;   // timestamp when submitted
        let timerInterval = null;

        // Fungsi untuk memuat soal dari file JSON
        async function loadQuestions() {
            try {
                const response = await fetch('questions.json');
                questions = await response.json();
                totalQuestions = questions.length;
                userAnswers = new Array(totalQuestions).fill(null);
                // Reset timer
                clearInterval(timerInterval);
                startTime = null;
                endTime = null;
                document.getElementById('timer-display').textContent = '00:00:00';
                showQuestion();
            } catch (error) {
                document.getElementById('quiz-container').innerHTML = `
                    <div class="alert alert-danger">
                        Gagal memuat soal: ${error.message}
                    </div>`;
            }
        }

        // Format waktu menjadi HH:MM:SS
        function formatTime(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // Menyimpan jawaban soal saat ini
        function saveCurrentAnswer() {
            if (currentQuestionIndex >= totalQuestions) return;
            const q = questions[currentQuestionIndex];
            if (q.type === 'multiple_choice' || q.type === 'true_false') {
                const selected = document.querySelector('input[name="option"]:checked');
                userAnswers[currentQuestionIndex] = selected ? parseInt(selected.value) : null;
            } else if (q.type === 'short_answer') {
                userAnswers[currentQuestionIndex] = document.getElementById('shortAnswer').value.trim();
            }
        }

        // Menampilkan soal saat ini
        function showQuestion() {
            const quizContainer = document.getElementById('quiz-container');
            if (currentQuestionIndex >= totalQuestions) {
                // Should not happen; we handle submit separately
                return;
            }

            const q = questions[currentQuestionIndex];
            let optionsHtml = '';

            if (q.type === 'multiple_choice') {
                q.options.forEach((opt, idx) => {
                    const letter = String.fromCharCode(65 + idx); // A, B, C, D
                    optionsHtml += `
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="option" id="opt${idx}" value="${idx}" ${userAnswers[currentQuestionIndex] == idx ? 'checked' : ''}>
                            <label class="form-check-label" for="opt${idx}">
                                ${letter}. ${opt}
                            </label>
                        </div>`;
                });
            } else if (q.type === 'true_false') {
                optionsHtml = `
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="option" id="optTrue" value="true" ${userAnswers[currentQuestionIndex] === true ? 'checked' : ''}>
                        <label class="form-check-label" for="optTrue">
                            A. Benar
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="option" id="optFalse" value="false" ${userAnswers[currentQuestionIndex] === false ? 'checked' : ''}>
                        <label class="form-check-label" for="optFalse">
                            B. Salah
                        </label>
                    </div>`;
            } else if (q.type === 'short_answer') {
                optionsHtml = `
                    <div class="mb-3">
                        <input type="text" class="form-control" id="shortAnswer" placeholder="Jawaban Anda" value="${userAnswers[currentQuestionIndex] || ''}">
                    </div>`;
            }

            // Build question navigator options
            const navOptions = [];
            for (let i = 0; i < totalQuestions; i++) {
                navOptions.push(`<option value="${i}" ${i === currentQuestionIndex ? 'selected' : ''}>${i + 1}</option>`);
            }
            const navHtml = `<select class="form-select nav-select" id="question-nav">${navOptions.join('')}</select>`;

            const isLastQuestion = currentQuestionIndex === totalQuestions - 1;

            quizContainer.innerHTML = `
                <div class="card mb-4">
                    <div class="card-body">
                        ${q.image ? `<img src="assets/${q.image}" class="question-img" alt="Ilustrasi soal">` : ''}
                        <h5 class="card-title">Soal ${currentQuestionIndex + 1} dari ${totalQuestions}</h5>
                        <p class="card-text">${q.prompt}</p>
                        <div id="options-container">
                            ${optionsHtml}
                        </div>
                        <div class="mt-3 d-flex justify-content-between align-items-center">
                            <div>
                                <label class="form-label">Lompat ke soal:</label>
                                ${navHtml}
                            </div>
                            <div>
                                ${isLastQuestion ? `
                                    <button class="btn btn-primary" id="submit-btn" onclick="submitAnswers()">
                                        Submit
                                    </button>
                                ` : `
                                    <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">
                                        Selanjutnya
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Enable/disable button based on selection
            const button = document.getElementById(isLastQuestion ? 'submit-btn' : 'next-btn');
            if (q.type === 'short_answer') {
                const input = document.getElementById('shortAnswer');
                input.addEventListener('input', () => {
                    button.disabled = !input.value.trim();
                });
                // Initial state
                button.disabled = !input.value.trim();
            } else {
                // For radio buttons, check if any selected
                const radios = document.querySelectorAll('input[name="option"]');
                radios.forEach(radio => {
                    radio.addEventListener('change', () => {
                        const anyChecked = document.querySelector('input[name="option"]:checked');
                        button.disabled = !anyChecked;
                    });
                });
                // Initial state
                button.disabled = !document.querySelector('input[name="option"]:checked');
            }

            // Handle question navigator change
            const navSelect = document.getElementById('question-nav');
            navSelect.addEventListener('change', (e) => {
                const targetIndex = parseInt(e.target.value);
                if (targetIndex !== currentQuestionIndex) {
                    // Save current answer before jumping
                    saveCurrentAnswer();
                    currentQuestionIndex = targetIndex;
                    showQuestion();
                }
            });

            // Start timer if not started
            if (!startTime) {
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    document.getElementById('timer-display').textContent = formatTime(elapsed);
                }, 1000);
            }
        }

        // Fungsi untuk pindah ke soal berikutnya
        function nextQuestion() {
            saveCurrentAnswer();
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestions) {
                showQuestion();
            } else {
                // Should not happen because we disable next button on last question
                submitAnswers();
            }
        }

        // Mengirimkan semua jawaban dan menampilkan hasil (tanpa mengungkapkan jawaban benar)
        function submitAnswers() {
            saveCurrentAnswer();
            // Stop timer
            clearInterval(timerInterval);
            endTime = Date.now();
            const elapsedSeconds = Math.floor((endTime - startTime) / 1000);
            const elapsedTimeStr = formatTime(elapsedSeconds);

            let score = 0;
            const reviewHtml = [];

            questions.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                let isCorrect = false;

                if (q.type === 'multiple_choice') {
                    const correctIdx = q.answerIndex;
                    isCorrect = userAns !== null && userAns === correctIdx;
                } else if (q.type === 'true_false') {
                    const correctBool = q.answer;
                    isCorrect = userAns !== null && userAns === correctBool;
                } else if (q.type === 'short_answer') {
                    const correctAns = q.answer.toString().toLowerCase().trim();
                    const userAnsStr = (userAns || '').toString().toLowerCase().trim();
                    isCorrect = userAnsStr === correctAns;
                }

                if (isCorrect) score++;

                // Build review item without revealing correct answer
                let selectedDisplay = '';
                if (q.type === 'multiple_choice') {
                    if (userAns !== null) {
                        selectedDisplay = `${String.fromCharCode(65+userAns)}. ${q.options[userAns]}`;
                    } else {
                        selectedDisplay = '(tidak dijawab)';
                    }
                } else if (q.type === 'true_false') {
                    if (userAns !== null) {
                        selectedDisplay = userAns ? 'Benar' : 'Salah';
                    } else {
                        selectedDisplay = '(tidak dijawab)';
                    }
                } else if (q.type === 'short_answer') {
                    selectedDisplay = userAns !== null ? userAns : '(tidak dijawab)';
                }

                const statusClass = isCorrect ? '' : 'wrong-mark';
                const statusText = isCorrect ? '✓' : '✗';

                reviewHtml.push(`
                    <div class="question-block mb-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6>Soal ${idx + 1} <span class="${statusClass}">${statusText}</span></h6>
                        </div>
                        <p><strong>Prompt:</strong> ${q.prompt}</p>
                        ${q.image ? `<img src="assets/${q.image}" class="question-img" alt="Ilustrasi soal" style="max-width:100px;">` : ''}
                        <p><strong>Jawaban Anda:</strong> ${selectedDisplay}</p>
                        ${!isCorrect ? `<p class="wrong-mark">Jawaban salah</p>` : ''}
                    </div>
                `);
            });

            const scorePercent = Math.round((score / totalQuestions) * 100);
            const scoreSummary = `
                <div class="score-top">
                    Nama: ${studentName || '-'}<br>
                    Kelas: ${studentClass || '-'}<br>
                    Waktu mulai: ${new Date(startTime).toLocaleTimeString('id-ID')}<br>
                    Waktu selesai: ${new Date(endTime).toLocaleTimeString('id-ID')}<br>
                    Durasi: ${elapsedTimeStr}<br>
                    Nilai Anda: ${score} dari ${totalQuestions} (${scorePercent}%)
                </div>
            `;

            // Tampilkan review
            document.getElementById('quiz-container').innerHTML = '';
            document.getElementById('score-summary').innerHTML = scoreSummary;
            document.getElementById('review-details').innerHTML = reviewHtml.join('');
            document.getElementById('score-container').classList.remove('d-none');

            // Siapkan tombol unduh hasil
            document.getElementById('download-btn').onclick = downloadReview;
        }

        // Menghasilkan file HTML hasil untuk diunduh
        function downloadReview() {
            const scorePercent = Math.round((score / totalQuestions) * 100);
            const elapsedTimeStr = formatTime(Math.floor((endTime - startTime) / 1000));
            const htmlContent = `
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hasil Latihan Kebumian</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.6; }
        .header { text-align: center; margin-bottom: 2rem; }
        .info { margin-bottom: 1rem; color: #555; }
        .score { font-size: 1.8rem; font-weight: bold; color: #2c3e50; margin-bottom: 1rem; }
        .question { border: 1px solid #ddd; border-radius: 5px; padding: 1rem; margin-bottom: 1rem; background-color: #f9f9f9; }
        .wrong { border-left: 4px solid #e74c3c; padding-left: 0.8rem; }
        .prompt { font-weight: bold; margin-bottom: 0.5rem; }
        .image { max-width: 100%; height: auto; margin: 1rem 0; display: block; }
        .answer { margin: 0.5rem 0; }
        .wrong-mark { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Hasil Latihan Kebumian</h1>
        <div class="info">
            Nama: ${studentName || '-'}<br>
            Kelas: ${studentClass || '-'}<br>
            Waktu mulai: ${new Date(startTime).toLocaleTimeString('id-ID')}<br>
            Waktu selesai: ${new Date(endTime).toLocaleTimeString('id-ID')}<br>
            Durasi: ${elapsedTimeStr}<br>
            Tanggal: ${new Date().toLocaleDateString('id-ID')}
        </div>
        <div class="score">Nilai: ${score} dari ${totalQuestions} (${scorePercent}%)</div>
    </div>
    ${questions.map((q, idx) => {
        const userAns = userAnswers[idx];
        let isCorrect = false;
        if (q.type === 'multiple_choice') {
            const correctIdx = q.answerIndex;
            isCorrect = userAns !== null && userAns === correctIdx;
        } else if (q.type === 'true_false') {
            const correctBool = q.answer;
            isCorrect = userAns !== null && userAns === correctBool;
        } else if (q.type === 'short_answer') {
            const correctAns = q.answer.toString().toLowerCase().trim();
            const userAnsStr = (userAns || '').toString().toLowerCase().trim();
            isCorrect = userAnsStr === correctAns;
        }
        let selectedDisplay = '';
        if (q.type === 'multiple_choice') {
            if (userAns !== null) {
                selectedDisplay = `${String.fromCharCode(65+userAns)}. ${q.options[userAns]}`;
            } else {
                selectedDisplay = '(tidak dijawab)';
            }
        } else if (q.type === 'true_false') {
            if (userAns !== null) {
                selectedDisplay = userAns ? 'Benar' : 'Salah';
            } else {
                selectedDisplay = '(tidak dijawab)';
            }
        } else if (q.type === 'short_answer') {
            selectedDisplay = userAns !== null ? userAns : '(tidak dijawab)';
        }
        const wrongClass = !isCorrect ? 'wrong' : '';
        return `
            <div class="question ${wrongClass}">
                <div class="prompt">Soal ${idx + 1}: ${q.prompt}</div>
                ${q.image ? `<img src="assets/${q.image}" class="image" alt="Ilustrasi soal">` : ''}
                <div class="answer"><strong>Jawaban Anda:</strong> ${selectedDisplay}</div>
                ${!isCorrect ? `<div class="answer wrong-mark">Status: Jawaban salah</div>` : ''}
            </div>
        `;
    }).join('')}
</body>
</html>
            `;

            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'hasil_latihan_kebumian.html';
            // Ensure click works
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Event listeners
        document.getElementById('start-quiz-btn').addEventListener('click', () => {
            studentName = document.getElementById('student-name').value.trim();
            studentClass = document.getElementById('student-class').value.trim();
            if (!studentName || !studentClass) {
                alert('Silakan isi Nama dan Kelas sebelum memulai latihan.');
                return;
            }
            // Hide header section, show quiz
            document.getElementById('header-section').classList.add('d-none');
            document.getElementById('quiz-container').classList.remove('d-none');
            loadQuestions();
        });

        document.getElementById('retake-btn').addEventListener('click', () => {
            // Reset everything
            currentQuestionIndex = 0;
            userAnswers = [];
            studentName = '';
            studentClass = '';
            startTime = null;
            endTime = null;
            clearInterval(timerInterval);
            document.getElementById('timer-display').textContent = '00:00:00';
            document.getElementById('header-section').classList.remove('d-none');
            document.getElementById('score-container').classList.add('d-none');
            document.getElementById('quiz-container').innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Memuat...</span>
                    </div>
                    <p class="mt-3">Memuat soal...</p>
                </div>
            `;
            // Clear input fields
            document.getElementById('student-name').value = '';
            document.getElementById('student-class').value = '';
        });

        // Inisialisasi awal: tampilkan header untuk input nama/kelas
        document.getElementById('header-section').classList.remove('d-none');
        document.getElementById('quiz-container').classList.add('d-none');
        document.getElementById('score-container').classList.add('d-none');
    </script>
</body>
</html>
