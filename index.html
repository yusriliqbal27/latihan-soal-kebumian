<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Kebumian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 4rem; }
        .question-img { max-width: 100%; height: auto; margin: 1rem 0; }
        .feedback { margin-top: 1rem; padding: 1rem; border-radius: 0.5rem; }
        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .wrong-mark { color: #dc3545; font-weight: bold; } /* red */
        .score-top { font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem; }
        .question-block { border: 1px solid #ddd; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; background-color: #fafafa; }
        .btn-download { margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <header class="mb-4">
            <h1>Latihan Kebumian</h1>
            <p class="text-muted">Silakan jawab semua soal berikut, lalu klik "Submit" untuk melihat nilai dan mengunduh hasil pekerjaan Anda.</p>
        </header>

        <div id="quiz-container">
            <!-- Soal akan diinject lewat JavaScript -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Memuat...</span>
                </div>
                <p class="mt-3">Memuat soal...</p>
            </div>
        </div>

        <div id="score-container" class="mt-4 d-none">
            <div class="score-top" id="score-summary"></div>
            <div id="review-details"></div>
            <div class="mt-3">
                <button id="retake-btn" class="btn btn-outline-primary me-2">Ulangi Latihan</button>
                <button id="download-btn" class="btn btn-success btn-download">Unduh Hasil</button>
            </div>
        </div>
    </div>

    <script>
        let questions = [];
        let currentQuestionIndex = 0;
        let userAnswers = []; // array of selected answers per question index
        let totalQuestions = 0;

        // Fungsi untuk memuat soal dari file JSON
        async function loadQuestions() {
            try {
                const response = await fetch('questions.json');
                questions = await response.json();
                totalQuestions = questions.length;
                userAnswers = new Array(totalQuestions).fill(null);
                showQuestion();
            } catch (error) {
                document.getElementById('quiz-container').innerHTML = `
                    <div class="alert alert-danger">
                        Gagal memuat soal: ${error.message}
                    </div>`;
            }
        }

        // Menampilkan soal saat ini
        function showQuestion() {
            const quizContainer = document.getElementById('quiz-container');
            if (currentQuestionIndex >= totalQuestions) {
                // Should not happen; we handle submit separately
                return;
            }

            const q = questions[currentQuestionIndex];
            let optionsHtml = '';

            if (q.type === 'multiple_choice') {
                q.options.forEach((opt, idx) => {
                    const letter = String.fromCharCode(65 + idx); // A, B, C, D
                    optionsHtml += `
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="option" id="opt${idx}" value="${idx}" ${userAnswers[currentQuestionIndex] == idx ? 'checked' : ''}>
                            <label class="form-check-label" for="opt${idx}">
                                ${letter}. ${opt}
                            </label>
                        </div>`;
                });
            } else if (q.type === 'true_false') {
                optionsHtml = `
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="option" id="optTrue" value="true" ${userAnswers[currentQuestionIndex] === true ? 'checked' : ''}>
                        <label class="form-check-label" for="optTrue">
                            A. Benar
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="option" id="optFalse" value="false" ${userAnswers[currentQuestionIndex] === false ? 'checked' : ''}>
                        <label class="form-check-label" for="optFalse">
                            B. Salah
                        </label>
                    </div>`;
            } else if (q.type === 'short_answer') {
                optionsHtml = `
                    <div class="mb-3">
                        <input type="text" class="form-control" id="shortAnswer" placeholder="Jawaban Anda" value="${userAnswers[currentQuestionIndex] || ''}">
                    </div>`;
            }

            const isLastQuestion = currentQuestionIndex === totalQuestions - 1;
            const buttonText = isLastQuestion ? 'Submit' : 'Selanjutnya';
            const buttonId = isLastQuestion ? 'submit-btn' : 'next-btn';

            quizContainer.innerHTML = `
                <div class="card mb-4">
                    <div class="card-body">
                        ${q.image ? `<img src="assets/${q.image}" class="question-img" alt="Ilustrasi soal">` : ''}
                        <h5 class="card-title">Soal ${currentQuestionIndex + 1} dari ${totalQuestions}</h5>
                        <p class="card-text">${q.prompt}</p>
                        <div id="options-container">
                            ${optionsHtml}
                        </div>
                        <div class="mt-3">
                            <button class="btn btn-primary" id="${buttonId}">
                                ${buttonText}
                            </button>
                        </div>
                    </div>
                </div>
            `;

            // Enable/disable next/submit button based on selection
            const button = document.getElementById(buttonId);
            if (q.type === 'short_answer') {
                const input = document.getElementById('shortAnswer');
                input.addEventListener('input', () => {
                    button.disabled = !input.value.trim();
                });
                // Initial state
                button.disabled = !input.value.trim();
            } else {
                // For radio buttons, check if any selected
                const radios = document.querySelectorAll('input[name="option"]');
                radios.forEach(radio => {
                    radio.addEventListener('change', () => {
                        button.disabled = !document.querySelector('input[name="option"]:checked');
                    });
                });
                // Initial state
                button.disabled = !document.querySelector('input[name="option"]:checked');
            }

            button.addEventListener('click', () => {
                // Save answer
                if (q.type === 'multiple_choice' || q.type === 'true_false') {
                    const selected = document.querySelector('input[name="option"]:checked');
                    userAnswers[currentQuestionIndex] = selected ? parseInt(selected.value) : null;
                } else if (q.type === 'short_answer') {
                    userAnswers[currentQuestionIndex] = document.getElementById('shortAnswer').value.trim();
                }

                if (isLastQuestion) {
                    submitAnswers();
                } else {
                    currentQuestionIndex++;
                    showQuestion();
                }
            });
        }

        // Mengirimkan semua jawaban dan menampilkan hasil (tanpa mengungkapkan jawaban benar)
        function submitAnswers() {
            let score = 0;
            const reviewHtml = [];

            questions.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                let isCorrect = false;

                if (q.type === 'multiple_choice') {
                    const correctIdx = q.answerIndex;
                    isCorrect = userAns !== null && userAns === correctIdx;
                } else if (q.type === 'true_false') {
                    const correctBool = q.answer;
                    isCorrect = userAns !== null && userAns === correctBool;
                } else if (q.type === 'short_answer') {
                    const correctAns = q.answer.toString().toLowerCase().trim();
                    const userAnsStr = (userAns || '').toString().toLowerCase().trim();
                    isCorrect = userAnsStr === correctAns;
                }

                if (isCorrect) score++;

                // Build review item without revealing correct answer
                let selectedDisplay = '';
                if (q.type === 'multiple_choice') {
                    if (userAns !== null) {
                        selectedDisplay = `${String.fromCharCode(65+userAns)}. ${q.options[userAns]}`;
                    } else {
                        selectedDisplay = '(tidak dijawab)';
                    }
                } else if (q.type === 'true_false') {
                    if (userAns !== null) {
                        selectedDisplay = userAns ? 'Benar' : 'Salah';
                    } else {
                        selectedDisplay = '(tidak dijawab)';
                    }
                } else if (q.type === 'short_answer') {
                    selectedDisplay = userAns !== null ? userAns : '(tidak dijawab)';
                }

                const statusClass = isCorrect ? '' : 'wrong-mark';
                const statusText = isCorrect ? '✓' : '✗';

                reviewHtml.push(`
                    <div class="question-block mb-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6>Soal ${idx + 1} <span class="${statusClass}">${statusText}</span></h6>
                        </div>
                        <p><strong>Prompt:</strong> ${q.prompt}</p>
                        ${q.image ? `<img src="assets/${q.image}" class="question-img" alt="Ilustrasi soal" style="max-width:100px;">` : ''}
                        <p><strong>Jawaban Anda:</strong> ${selectedDisplay}</p>
                        ${!isCorrect ? `<p class="wrong-mark">Jawaban salah</p>` : ''}
                    </div>
                `);
            });

            const scorePercent = Math.round((score / totalQuestions) * 100);
            const scoreSummary = `
                <div class="score-top">Nilai Anda: ${score} dari ${totalQuestions} (${scorePercent}%)</div>
            `;

            // Tampilkan review
            document.getElementById('quiz-container').innerHTML = '';
            document.getElementById('score-summary').innerHTML = scoreSummary;
            document.getElementById('review-details').innerHTML = reviewHtml.join('');
            document.getElementById('score-container').classList.remove('d-none');

            // Siapkan tombol unduh hasil
            document.getElementById('download-btn').onclick = downloadReview;
        }

        // Menghasilkan file HTML hasil untuk diunduh
        function downloadReview() {
            const scorePercent = Math.round((score / totalQuestions) * 100);
            const htmlContent = `
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hasil Latihan Kebumian</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.6; }
        .header { text-align: center; margin-bottom: 2rem; }
        .score { font-size: 1.8rem; font-weight: bold; color: #2c3e50; margin-bottom: 1rem; }
        .question { border: 1px solid #ddd; border-radius: 5px; padding: 1rem; margin-bottom: 1rem; background-color: #f9f9f9; }
        .wrong { border-left: 4px solid #e74c3c; padding-left: 0.8rem; }
        .prompt { font-weight: bold; margin-bottom: 0.5rem; }
        .image { max-width: 100%; height: auto; margin: 1rem 0; display: block; }
        .answer { margin: 0.5rem 0; }
        .wrong-mark { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Hasil Latihan Kebumian</h1>
        <div class="score">Nilai: ${score} dari ${totalQuestions} (${scorePercent}%)</div>
    </div>
    ${questions.map((q, idx) => {
        const userAns = userAnswers[idx];
        let isCorrect = false;
        if (q.type === 'multiple_choice') {
            const correctIdx = q.answerIndex;
            isCorrect = userAns !== null && userAns === correctIdx;
        } else if (q.type === 'true_false') {
            const correctBool = q.answer;
            isCorrect = userAns !== null && userAns === correctBool;
        } else if (q.type === 'short_answer') {
            const correctAns = q.answer.toString().toLowerCase().trim();
            const userAnsStr = (userAns || '').toString().toLowerCase().trim();
            isCorrect = userAnsStr === correctAns;
        }
        let selectedDisplay = '';
        if (q.type === 'multiple_choice') {
            if (userAns !== null) {
                selectedDisplay = `${String.fromCharCode(65+userAns)}. ${q.options[userAns]}`;
            } else {
                selectedDisplay = '(tidak dijawab)';
            }
        } else if (q.type === 'true_false') {
            if (userAns !== null) {
                selectedDisplay = userAns ? 'Benar' : 'Salah';
            } else {
                selectedDisplay = '(tidak dijawab)';
            }
        } else if (q.type === 'short_answer') {
            selectedDisplay = userAns !== null ? userAns : '(tidak dijawab)';
        }
        const wrongClass = !isCorrect ? 'wrong' : '';
        return `
            <div class="question ${wrongClass}">
                <div class="prompt">Soal ${idx + 1}: ${q.prompt}</div>
                ${q.image ? `<img src="assets/${q.image}" class="image" alt="Ilustrasi soal">` : ''}
                <div class="answer"><strong>Jawaban Anda:</strong> ${selectedDisplay}</div>
                ${!isCorrect ? `<div class="answer wrong-mark">Status: Jawaban salah</div>` : ''}
            </div>
        `;
    }).join('')}
</body>
</html>
            `;

            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'hasil_latihan_kebumian.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('retake-btn').addEventListener('click', () => {
            currentQuestionIndex = 0;
            userAnswers = [];
            document.getElementById('score-container').classList.add('d-none');
            loadQuestions();
        });

        // Inisialisasi
        loadQuestions();
    </script>
</body>
</html>
