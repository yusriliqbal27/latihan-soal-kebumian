<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Kebumian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 4rem; }
        .question-img { max-width: 100%; height: auto; margin: 1rem 0; }
        .feedback { margin-top: 1rem; padding: 1rem; border-radius: 0.5rem; }
        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .disabled { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <header class="mb-4">
            <h1>Latihan Kebumian</h1>
            <p class="text-muted">Silakan jawab semua soal berikut, lalu klik "Submit" untuk melihat nilai Anda.</p>
        </header>

        <div id="quiz-container">
            <!-- Soal akan diinject lewat JavaScript -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Memuat...</span>
                </div>
                <p class="mt-3">Memuat soal...</p>
            </div>
        </div>

        <div id="score-container" class="mt-4 d-none">
            <h2>Hasil Latihan</h2>
            <div id="score-details"></div>
            <div id="score-summary" class="fs-4"></div>
            <button id="retake-btn" class="btn btn-outline-primary mt-3">Ulangi Latihan</button>
        </div>
    </div>

    <script>
        let questions = [];
        let currentQuestionIndex = 0;
        let userAnswers = []; // array of selected answers per question index
        let totalQuestions = 0;

        // Fungsi untuk memuat soal dari file JSON
        async function loadQuestions() {
            try {
                const response = await fetch('questions.json');
                questions = await response.json();
                totalQuestions = questions.length;
                userAnswers = new Array(totalQuestions).fill(null);
                showQuestion();
            } catch (error) {
                document.getElementById('quiz-container').innerHTML = `
                    <div class="alert alert-danger">
                        Gagal memuat soal: ${error.message}
                    </div>`;
            }
        }

        // Menampilkan soal saat ini
        function showQuestion() {
            const quizContainer = document.getElementById('quiz-container');
            if (currentQuestionIndex >= totalQuestions) {
                // Should not happen; we handle submit separately
                return;
            }

            const q = questions[currentQuestionIndex];
            let optionsHtml = '';

            if (q.type === 'multiple_choice') {
                q.options.forEach((opt, idx) => {
                    const letter = String.fromCharCode(65 + idx); // A, B, C, D
                    optionsHtml += `
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="option" id="opt${idx}" value="${idx}" ${userAnswers[currentQuestionIndex] == idx ? 'checked' : ''}>
                            <label class="form-check-label" for="opt${idx}">
                                ${letter}. ${opt}
                            </label>
                        </div>`;
                });
            } else if (q.type === 'true_false') {
                optionsHtml = `
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="option" id="optTrue" value="true" ${userAnswers[currentQuestionIndex] === true ? 'checked' : ''}>
                        <label class="form-check-label" for="optTrue">
                            A. Benar
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="option" id="optFalse" value="false" ${userAnswers[currentQuestionIndex] === false ? 'checked' : ''}>
                        <label class="form-check-label" for="optFalse">
                            B. Salah
                        </label>
                    </div>`;
            } else if (q.type === 'short_answer') {
                optionsHtml = `
                    <div class="mb-3">
                        <input type="text" class="form-control" id="shortAnswer" placeholder="Jawaban Anda" value="${userAnswers[currentQuestionIndex] || ''}">
                    </div>`;
            }

            const isLastQuestion = currentQuestionIndex === totalQuestions - 1;
            const buttonText = isLastQuestion ? 'Submit' : 'Selanjutnya';
            const buttonId = isLastQuestion ? 'submit-btn' : 'next-btn';

            quizContainer.innerHTML = `
                <div class="card mb-4">
                    <div class="card-body">
                        ${q.image ? `<img src="assets/${q.image}" class="question-img" alt="Ilustrasi soal">` : ''}
                        <h5 class="card-title">Soal ${currentQuestionIndex + 1} dari ${totalQuestions}</h5>
                        <p class="card-text">${q.prompt}</p>
                        <div id="options-container">
                            ${optionsHtml}
                        </div>
                        <div class="mt-3">
                            <button class="btn btn-primary" id="${buttonId}" ${currentQuestionIndex === 0 && q.type === 'short_answer' && !userAnswers[currentQuestionIndex] ? '' : ''}>
                                ${buttonText}
                            </button>
                        </div>
                    </div>
                </div>
            `;

            // Enable/disable next/submit button based on selection
            const button = document.getElementById(buttonId);
            if (q.type === 'short_answer') {
                const input = document.getElementById('shortAnswer');
                input.addEventListener('input', () => {
                    button.disabled = !input.value.trim();
                });
                // Initial state
                button.disabled = !input.value.trim();
            } else {
                // For radio buttons, check if any selected
                const radios = document.querySelectorAll('input[name="option"]');
                radios.forEach(radio => {
                    radio.addEventListener('change', () => {
                        button.disabled = !document.querySelector('input[name="option"]:checked');
                    });
                });
                // Initial state
                button.disabled = !document.querySelector('input[name="option"]:checked');
            }

            button.addEventListener('click', () => {
                // Save answer
                if (q.type === 'multiple_choice' || q.type === 'true_false') {
                    const selected = document.querySelector('input[name="option"]:checked');
                    userAnswers[currentQuestionIndex] = selected ? parseInt(selected.value) : null;
                } else if (q.type === 'short_answer') {
                    userAnswers[currentQuestionIndex] = document.getElementById('shortAnswer').value.trim();
                }

                if (isLastQuestion) {
                    submitAnswers();
                } else {
                    currentQuestionIndex++;
                    showQuestion();
                }
            });
        }

        // Mengirimkan semua jawaban dan menampilkan hasil
        function submitAnswers() {
            let score = 0;
            const resultsHtml = [];

            questions.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                let isCorrect = false;
                let feedback = '';

                if (q.type === 'multiple_choice') {
                    const correctIdx = q.answerIndex;
                    isCorrect = userAns !== null && userAns === correctIdx;
                    feedback = isCorrect ?
                        `Benar! ${q.explanation || ''}` :
                        `Salah. Jawaban yang benar adalah ${String.fromCharCode(65 + correctIdx)}. ${q.explanation || ''}`;
                } else if (q.type === 'true_false') {
                    const correctBool = q.answer;
                    isCorrect = userAns !== null && userAns === correctBool;
                    feedback = isCorrect ?
                        `Benar! ${q.explanation || ''}` :
                        `Salah. Jawaban yang benar adalah ${correctBool ? 'Benar' : 'Salah'}. ${q.explanation || ''}`;
                } else if (q.type === 'short_answer') {
                    const correctAns = q.answer.toString().toLowerCase().trim();
                    const userAnsStr = (userAns || '').toString().toLowerCase().trim();
                    isCorrect = userAnsStr === correctAns;
                    feedback = isCorrect ?
                        `Benar! ${q.explanation || ''}` :
                        `Salah. Jawaban yang benar adalah "${q.answer}". ${q.explanation || ''}`;
                }

                if (isCorrect) score++;

                // Build result item
                const optionLetters = q.type === 'multiple_choice' ? q.options.map((opt, i) => `${String.fromCharCode(65+i)}. ${opt}`).join('<br>') : '';
                const selectedOptionText = q.type === 'multiple_choice' && userAns !== null ? q.options[userAns] : '';
                const selectedOptionLabel = q.type === 'multiple_choice' && userAns !== null ? String.fromCharCode(65+userAns) : '';
                const selectedTF = q.type === 'true_false' && userAns !== null ? (userAns ? 'Benar' : 'Salah') : '';
                const selectedSA = q.type === 'short_answer' ? (userAns || '(tidak diisi)') : '';

                let selectedDisplay = '';
                if (q.type === 'multiple_choice') {
                    selectedDisplay = selectedOptionLabel ? `${selectedOptionLabel}. ${selectedOptionText}` : '(tidak dijawab)';
                } else if (q.type === 'true_false') {
                    selectedDisplay = selectedTF !== '' ? selectedTF : '(tidak dijawab)';
                } else if (q.type === 'short_answer') {
                    selectedDisplay = selectedSA;
                }

                resultsHtml.push(`
                    <div class="result-item mb-3 p-3 border rounded">
                        <h6>Soal ${idx + 1}</h6>
                        <p><strong>Prompt:</strong> ${q.prompt}</p>
                        ${q.image ? `<img src="assets/${q.image}" class="question-img" alt="Ilustrasi soal" style="max-width:100px;">` : ''}
                        ${q.type === 'multiple_choice' ? `<p><strong>Opsi:</strong><br>${optionLetters}</p>` : ''}
                        <p><strong>Jawaban Anda:</strong> ${selectedDisplay}</p>
                        <p><strong>Jawaban Benar:</strong> ${q.type === 'multiple_choice' ? String.fromCharCode(65 + q.answerIndex) : q.type === 'true_false' ? (q.answer ? 'Benar' : 'Salah') : q.answer}</p>
                        <p class="mt-2"><strong>Hasil:</strong> <span class="${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? '✓ Benar' : '✗ Salah'}</span></p>
                        ${q.explanation ? `<p class="mt-2"><strong>Penjelasan:</strong> ${q.explanation}</p>` : ''}
                    </div>
                `);
            });

            const scorePercent = Math.round((score / totalQuestions) * 100);
            const scoreSummary = `
                <div class="alert alert-info mt-3">
                    <h4>Anda menjawab benar ${score} dari ${totalQuestions} soal (${scorePercent}%).</h4>
                </div>
            `;

            document.getElementById('quiz-container').innerHTML = '';
            document.getElementById('score-details').innerHTML = resultsHtml.join('');
            document.getElementById('score-summary').innerHTML = scoreSummary;
            document.getElementById('score-container').classList.remove('d-none');
        }

        document.getElementById('retake-btn').addEventListener('click', () => {
            currentQuestionIndex = 0;
            userAnswers = [];
            document.getElementById('score-container').classList.add('d-none');
            loadQuestions();
        });

        // Inisialisasi
        loadQuestions();
    </script>
</body>
</html>
