<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Kebumian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 4rem; }
        .question-img { max-width: 100%; height: auto; margin: 1rem 0; }
        .btn-check-answer { margin-top: 1rem; }
        .feedback { margin-top: 1rem; padding: 1rem; border-radius: 0.5rem; }
        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <header class="mb-4">
            <h1>Latihan Kebumian</h1>
            <p class="text-muted">Silakan kerjakan latihan di bawah ini. Setelah selesai, klik "Periksa Jawaban" untuk melihat nilai Anda.</p>
        </header>

        <div id="quiz-container">
            <!-- Soal akan diinject lewat JavaScript -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Memuat...</span>
                </div>
                <p class="mt-3">Memuat soal...</p>
            </div>
        </div>

        <div id="score-container" class="mt-4 d-none">
            <h2>Hasil Latihan</h2>
            <div id="score-display" class="fs-4"></div>
            <button id="retake-btn" class="btn btn-outline-primary mt-3">Ulangi Latihan</button>
        </div>
    </div>

    <script>
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let totalQuestions = 0;

        // Fungsi untuk memuat soal dari file JSON
        async function loadQuestions() {
            try {
                const response = await fetch('questions.json');
                questions = await response.json();
                totalQuestions = questions.length;
                showQuestion();
            } catch (error) {
                document.getElementById('quiz-container').innerHTML = `
                    <div class="alert alert-danger">
                        Gagal memuat soal: ${error.message}
                    </div>`;
            }
        }

        // Menampilkan soal saat ini
        function showQuestion() {
            const quizContainer = document.getElementById('quiz-container');
            if (currentQuestionIndex >= totalQuestions) {
                showScore();
                return;
            }

            const q = questions[currentQuestionIndex];
            let optionsHtml = '';

            if (q.type === 'multiple_choice') {
                q.options.forEach((opt, idx) => {
                    const letter = String.fromCharCode(65 + idx); // A, B, C, D
                    optionsHtml += `
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="option" id="opt${idx}" value="${idx}">
                            <label class="form-check-label" for="opt${idx}">
                                ${letter}. ${opt}
                            </label>
                        </div>`;
                });
            } else if (q.type === 'true_false') {
                optionsHtml = `
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="option" id="optTrue" value="true">
                        <label class="form-check-label" for="optTrue">
                            A. Benar
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="option" id="optFalse" value="false">
                        <label class="form-check-label" for="optFalse">
                            B. Salah
                        </label>
                    </div>`;
            } else if (q.type === 'short_answer') {
                optionsHtml = `
                    <div class="mb-3">
                        <input type="text" class="form-control" id="shortAnswer" placeholder="Jawaban Anda">
                    </div>`;
            }

            quizContainer.innerHTML = `
                <div class="card mb-4">
                    <div class="card-body">
                        ${q.image ? `<img src="assets/${q.image}" class="question-img" alt="Ilustrasi soal">` : ''}
                        <h5 class="card-title">Soal ${currentQuestionIndex + 1} dari ${totalQuestions}</h5>
                        <p class="card-text">${q.prompt}</p>
                        <div id="options-container">
                            ${optionsHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        // Memeriksa jawaban
        function checkAnswer() {
            const q = questions[currentQuestionIndex];
            let isCorrect = false;
            let feedback = '';

            if (q.type === 'multiple_choice' || q.type === 'true_false') {
                const selectedOption = document.querySelector('input[name="option"]:checked');
                if (!selectedOption) {
                    alert('Silakan pilih salah satu opsi!');
                    return;
                }
                const selectedValue = selectedOption.value;
                if (q.type === 'multiple_choice') {
                    const selectedIndex = parseInt(selectedValue);
                    isCorrect = selectedIndex === q.answerIndex;
                    feedback = isCorrect ?
                        `Benar! ${q.explanation || ''}` :
                        `Salah. Jawaban yang benar adalah ${String.fromCharCode(65 + q.answerIndex)}. ${q.explanation || ''}`;
                } else { // true_false
                    const selectedBool = selectedValue === 'true';
                    isCorrect = selectedBool === q.answer;
                    feedback = isCorrect ?
                        `Benar! ${q.explanation || ''}` :
                        `Salah. Jawaban yang benar adalah ${q.answer ? 'Benar' : 'Salah'}. ${q.explanation || ''}`;
                }
            } else if (q.type === 'short_answer') {
                const userAnswer = document.getElementById('shortAnswer').value.trim().toLowerCase();
                const correctAnswer = q.answer.toLowerCase();
                isCorrect = userAnswer === correctAnswer;
                feedback = isCorrect ?
                    `Benar! ${q.explanation || ''}` :
                    `Salah. Jawaban yang benar adalah "${q.answer}". ${q.explanation || ''}`;
            }

            // Tampilkan feedback
            const feedbackDiv = document.createElement('div');
            feedbackDiv.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackDiv.innerHTML = `<strong>${isCorrect ? '✓ Benar' : '✗ Salah'}</strong><p>${feedback}</p>`;
            document.getElementById('quiz-container').appendChild(feedbackDiv);

            // Disable pilihan dan tampilkan tombol lanjut
            document.querySelectorAll('input[name="option"]').forEach(el => el.disabled = true);
            if (q.type === 'short_answer') {
                document.getElementById('shortAnswer').disabled = true;
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'btn btn-primary btn-check-answer mt-3';
            nextBtn.textContent = currentQuestionIndex < totalQuestions - 1 ? 'Soal Berikutnya' : 'Lihat Nilai';
            nextBtn.onclick = () => {
                if (isCorrect) score++;
                currentQuestionIndex++;
                if (currentQuestionIndex >= totalQuestions) {
                    showScore();
                } else {
                    showQuestion();
                }
            };
            document.getElementById('quiz-container').appendChild(nextBtn);
        }

        function showScore() {
            const scorePercent = Math.round((score / totalQuestions) * 100);
            document.getElementById('score-display').innerHTML =
                `Anda menjawab benar ${score} dari ${totalQuestions} soal (${scorePercent}%).`;
            document.getElementById('score-container').classList.remove('d-none');
            document.getElementById('quiz-container').innerHTML = '';
        }

        document.getElementById('retake-btn').addEventListener('click', () => {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('score-container').classList.add('d-none');
            loadQuestions();
        });

        // Inisialisasi
        loadQuestions();
    </script>
</body>
</html>
